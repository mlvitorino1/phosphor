name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: phosphor
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: phosphor_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations to isolated PostgreSQL
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://phosphor:test-only-password@localhost:5432/phosphor_test
      - name: Formatting, lint, types and regression tests
        run: npm run check
        env:
          TEST_DATABASE_URL: postgresql://phosphor:test-only-password@localhost:5432/phosphor_test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
